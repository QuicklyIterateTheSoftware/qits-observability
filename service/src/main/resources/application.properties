# The application config for qits-observability as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# a context ships DEFAULTS it does not own the deployment of. Keep this file to what the *process*
# owns; the telemetry buffer's caps (qits.telemetry.max-*) stay defaulted in code, where a consumer
# can still override them.
#
# Everything here was previously supplied by the monorepo's app shell
# (service/src/main/resources/application.properties, monolith-only), which is why the suite carried
# private copies in src/test/resources and the packaged app had none.

quarkus.application.name=qits-observability

# The JAX-RS prefix every qits route lives under. qits-gateway routes verbatim by prefix —
# /observability/* reaches this service, and nothing else does — so the segment is part of the path
# this process itself must serve, not something a proxy strips.
#
# This is also the one setting here that is load-bearing beyond this repo: OTel SDKs are configured
# with a LITERAL endpoint URL (OTEL_EXPORTER_OTLP_ENDPOINT=http://<host>/observability/api/otel),
# not a discovered one, and they append /v1/<signal> themselves — so ingest lands at
# /observability/api/otel/v1/*. Drop or shorten this and ingest moves somewhere the exporters are
# not pointed at, every export 404s, and nothing anywhere reports an error — the SDK's retry is
# silent and the receiver never sees the request. The suite asserts the full prefixed paths, so a
# test run would stay green either way.
quarkus.rest.path=/observability/api

# Where the "observability" MCP server mounts. The server NAME is half of the key, so the name and
# this line change together: qits-projects also declares a server, and both were once called
# "repository" — a client can only ever address one server of a given name, so these tools are the
# observability server's. Not optional either: quarkus-mcp-server-http refuses to START without a
# root-path for a declared server name (IllegalStateException: Invalid server name), so omitting
# this does not disable the tools, it stops the process booting.
quarkus.mcp.server.observability.http.root-path=/observability/mcp

# --- the SPA ------------------------------------------------------------------------------------
# Quinoa builds service/src/main/webui — the qits-spa-observability submodule — during augmentation
# and serves the bundle from this process. The UI and the API it calls are therefore one deployable
# and one origin: no CORS, no second container, and the gateway keeps routing a single prefix.
#
# Served at /observability, the same segment everything else here lives under, so the SPA sits
# BESIDE its own API (/observability/api) rather than above it. The Angular build must agree —
# angular.json sets baseHref "/observability/", and if the two ever disagree the page loads and then
# fetches its bundle from the wrong root, which looks like a blank screen and no server-side error.
quarkus.quinoa.ui-root-path=/observability

# Deep links. Without this a reload of /observability/anything is a 404 from the static handler,
# because only index.html exists on disk — the routes are the router's, resolved in the browser.
#
# It must not swallow the API, and left alone it would: the fallback is what answers anything under
# ui-root-path that is not a file on disk, so /observability/api/typo would return index.html with a
# 200 instead of a 404, and a client would parse HTML as JSON. Quinoa's ignored-path-prefixes is the
# exclusion list, and it defaults to quarkus.rest.path plus quarkus.http.non-application-root-path —
# but NOT the MCP root-path, so the list is spelled out here.
#
# THESE ARE RELATIVE TO ui-root-path, not absolute request paths. QuinoaSPARoutingHandler strips the
# ui root before matching (resolvePath() in QuinoaRecorder), so it compares "/api", never
# "/observability/api" — and an absolute spelling silently matches nothing, which looks exactly like
# not having configured it at all. Each entry below is the tail of the corresponding key above:
# quarkus.rest.path=/observability/api → /api, non-application-root-path=/observability/q → /q,
# the MCP root-path=/observability/mcp → /mcp. They move together.
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q,/mcp

# Where the Angular CLI leaves the bundle. Stated rather than left to quinoa's framework detection
# because Angular 17+ splits its output into dist/<project>/browser (and, with SSR, server/); the
# project name is angular.json's, not this repo's module name, and detection that resolved to
# dist/ alone would package the parent directory. Moves only if angular.json's project is renamed.
quarkus.quinoa.build-dir=dist/qits-spa-observability/browser

# Nothing here disables quinoa for tests, because it already is: the extension defaults to enabled
# EXCEPT in test mode. That is what keeps AGENTS.md's rule intact on the path that matters — the
# suite still needs no node, no npm registry and no network. `mvn package` does need all three now,
# and that is the real cost of serving the UI from this process; it is a build prerequisite, not a
# test one.

# --- the API document -------------------------------------------------------------------------
# Quarkus' non-application root path: what the framework serves rather than application code. It
# sits OUTSIDE quarkus.rest.path and moves only with this key, so anything left at the root /q would
# be unreachable through the gateway. Served at /observability/q/openapi, with the browsable UI at
# /observability/q/swagger-ui — quarkus.swagger-ui.path is relative and follows on its own; do not
# pin it.
quarkus.http.non-application-root-path=/observability/q

# always-include because swagger-ui is a dev-mode-only extension by default, and the whole point of
# packaging these as processes is that each one documents its own surface in a real deployment.
#
# Note this document deliberately does NOT describe the ingest endpoints: they are an OTLP wire
# protocol for SDKs, so they are @Operation(hidden = true). The document is the JSON API a client
# generator consumes.
quarkus.smallrye-openapi.info-title=qits-observability API
quarkus.swagger-ui.always-include=true

# OTLP export bodies are batches, not requests — the monorepo raised this app-wide for the same
# reason and the ingest surface inherited it. Left at the platform default a busy exporter's batch
# is rejected at the HTTP layer, before OtelReceiverResource is ever entered.
quarkus.http.limits.max-body-size=64M

# No datasource, no Flyway: this context owns no tables. TelemetryStore is in-memory and a restart
# empties it — deliberate, documented in README.md, and worth knowing before a redeploy.

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-observability` — the deployable's name, not the module's — rather than
# qits-telemetry-<version>-runner, so `-Dnative` produces target/qits-observability and the process
# is identifiable in `ps` / `docker top` as the thing the gateway routes to. The failsafe plugin's
# native.image.path in service/pom.xml spells the same name; they move together, and if they drift
# the native IT launches nothing.
quarkus.package.output-name=qits-observability
quarkus.package.jar.add-runner-suffix=false

# --- telemetry: this service is also a sender ---------------------------------------------------
# It exports to itself, which reads odd and is deliberate. A receiver that reports nothing about
# itself is the one service whose latency, errors and restarts are invisible, and the alternative —
# a second collector — does not exist. Same key as everywhere else, so a deployment that moves the
# receiver moves this with it and self-export is simply what the default value happens to mean.
qits.observability.url=http://qits-observability:8080

quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default. This receiver decodes all three signals,
# and a log record correlated to a trace is most of why it exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop the platform's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# HERE THE RECEIVER IS ALSO THE DESTINATION, so the loop the suppress line below cuts for traces has
# to be answered for logs too — and what answers it is that nothing on the ingest path logs at this
# floor. A batch of log records POSTs to this process' own /v1/logs, and handling that request emits
# no record of its own: the only two loggers in this application are OtelForwarder, which is DEBUG
# only and so below the INFO floor twice over, and TelemetryStore's metric-series cap warning, which
# latches per bucket and fires once. So an export produces no input to the next one — there is no
# feedback term, which is exactly what a server span per ingest WAS. The one record the pipeline can
# make of itself is the SDK's own "Failed to export" diagnostic, emitted only when an export already
# failed and rate-limited by OpenTelemetry's ThrottlingLogger, so a failing receiver cannot amplify
# either. The live platform shows qits-observability's self-export arriving in its own source bucket
# without a blowup.
#
# That an ordinary logger call really becomes an exported OTLP record is proven once, in qits-events:
# its OtelLogBridgeTest decodes a real ExportLogsServiceRequest and PackagedLogBridgeIT repeats the
# claim against the packaged artifact. The same extension and the same four keys run here, so this
# repo guards the configuration rather than re-proving the behaviour — OtelLogConfigTest pins these
# values so drift cannot disable log export quietly.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the UI has nothing to plot until every service
# says this.
#
# Self-export does not close the loop below. Metrics leave on a fixed interval and are aggregates,
# so the ingest request one export makes only lands in the next interval's counters: a constant
# trickle, not the self-sustaining one the suppress line exists for.
quarkus.otel.metrics.enabled=true

# THE LOOP, and the one line that cuts it. Exporting a span POSTs to this service's own ingest
# route, which is an inbound HTTP request, which produces a server span, which is exported... a
# self-sustaining trickle that never stops and drowns real telemetry in the receiver's own
# plumbing. Suppressing the three ingest uris removes exactly those server spans and nothing else:
# the query surface, the MCP server and everything a reader cares about still trace normally.
#
# Traces only, and that is enough — log records are not emitted per export, so the logs signal does
# not close the same circle.
quarkus.otel.traces.suppress-application-uris=/observability/api/otel/v1/traces,/observability/api/otel/v1/logs,/observability/api/otel/v1/metrics

# Dark outside a deployment, as everywhere else.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
