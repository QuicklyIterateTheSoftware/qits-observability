# Test-only overrides. Quarkus MERGES this file with `src/main/resources/application.properties`
# during a test run — main's copy is not shadowed, it is still in effect for every key this file
# does not set. So app-level settings (quarkus.rest.path, the MCP root-path, body limits, the
# OpenAPI info) belong there and MUST NOT be re-declared here: a test copy that drifts from the
# shipped copy makes the suite lie. The tests would keep asserting /api/* while the packaged process
# served something else, and stay green the whole way.
#
# Only put a key here if the test run genuinely needs a DIFFERENT value from what ships.
#
# Nothing does today: this context owns no tables (no datasource, no Flyway, no in-memory H2 URL and
# no target/-scoped data dir to point at), the store is in-memory already, and the store's caps
# default in code (qits.telemetry.max-*).
