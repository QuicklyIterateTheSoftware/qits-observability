# The JAX-RS prefix every qits route lives under. A consuming application sets this in its own
# application.properties (the monorepo's app shell does, and that file is monolith-only); the tests
# assert against the same absolute paths — /api/otel/v1/*, /api/config.json,
# /api/repositories/.../telemetry — so they set it too.
quarkus.rest.path=/api

# Where the "repository" MCP server mounts. Same story: the monorepo declares it in the app shell's
# application.properties, and TelemetryMcpToolsTest connects McpAssured to /mcp/repository.
# Without this the MCP tools are unreachable and every tools/list in the suite fails.
quarkus.mcp.server.repository.http.root-path=/mcp/repository

# No datasource, no Flyway, no telemetry-buffer tuning here on purpose: this context owns no tables
# (the store is in-memory) and the store's caps default in code (qits.telemetry.max-*).
